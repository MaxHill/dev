set -g mouse on

# TPM plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'niksingh710/minimal-tmux-status'
set -g @plugin 'christoomey/vim-tmux-navigator'

# gruvbox material dark hard theme colors for minimal-tmux-status
# NOTE: this plugin controls window-status-* itself, so configure it via @minimal-tmux-* vars.
set -g @minimal-tmux-bg "#d8a657"  # active window highlight color
set -g @minimal-tmux-fg "#000000"  # active window text color
set -g @minimal-tmux-justify "left"
set -g @minimal-tmux-window-status-format " #I:#W "
# Put windows on the left; keep tmux indicator on the right with prefix highlight behavior.
set -g @minimal-tmux-left false
set -g @minimal-tmux-right true
set -g @minimal-tmux-status-right "#[bg=default,fg=default,bold]#{?client_prefix,, tmux }#[bg=#d8a657,fg=#000000,bold]#{?client_prefix, tmux ,}#[bg=default,fg=default,bold]"
set -g status-left-length 0
set -g status-right-length 20
set-option -g mode-style "bg=#d8a657,fg=#000000" # makes the highlight more readable

#  ------------------------------------------------------------------------
#  Options
#  ------------------------------------------------------------------------

# Vim-style keys in copy-mode
setw -g mode-keys vi

# vim-tmux-navigator: don't wrap when jumping past edge panes
set -g @vim_navigator_no_wrap 1

# Remove escape delay (important for nvim)
set -s escape-time 0

# Extended keys (CSI-u) so modern key combos reach nvim
set-window-option -g xterm-keys on
set -g extended-keys on
set -g extended-keys-format csi-u

# Secondary prefix key
set -g prefix2 C-Space
bind C-Space send-prefix -2

# start window numbers at 1 to match keyboard order with tmux window order
set -g base-index 1
set-window-option -g pane-base-index 1
# renumber windows sequentially after closing any of them
set -g renumber-windows on

#  ------------------------------------------------------------------------
#  Keybindings
#  ------------------------------------------------------------------------

# Reload tmux conf
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded ~/.config/tmux/.tmux.conf"

# Pane resize (repeatable with -r)
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# Splits and new windows preserve current pane path
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind-key g display-popup -d "#{pane_current_path}" -w 95% -h 95% -E "nvim -c 'Neogit'"

bind-key -n C-f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind-key -r M-h run-shell "tmux neww ~/.local/bin/tmux-sessionizer -s 0"

bind-key a run-shell "~/.local/bin/quick-question.sh"


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
