# Match the Ghostty configuration; keep both terminals available.
font_family Maple Mono NF
font_size 12.0
modify_font cell_height 130%

include themes/gruvbox-material-dark-hard.conf

# Ghostty defaults to two pixels of padding, rather than Kitty's zero.
window_padding_width 2
background_opacity 0.7
# Request background blur; Hyprland also has compositor blur enabled.
background_blur 20
cursor_shape block
tab_bar_style hidden

# Auto-attach to tmux, or create the main session if none exists.
shell /bin/zsh -lc "exec tmux new-session -A -s main"

# Preserve the CSI-u sequences used by tmux and TUIs in Ghostty.
map shift+enter send_text all \x1b[13;2u
map alt+shift+enter send_text all \x1b[13;4u
