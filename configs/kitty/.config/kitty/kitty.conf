# Match the Ghostty configuration; keep both terminals available.
font_family Maple Mono NF
font_size 12.0
modify_font cell_height 130%

# The theme command selects the palette and reloads Kitty.
include ~/.config/theme/kitty.conf

# Ghostty defaults to two pixels of padding, rather than Kitty's zero.
window_padding_width 2
background_opacity 0.85
# Request background blur; Hyprland also has compositor blur enabled.
background_blur 20
cursor_shape block
tab_bar_style hidden

# Close windows without asking for confirmation about running processes.
confirm_os_window_close 0

# Preserve the CSI-u sequences used by tmux and TUIs in Ghostty.
map shift+enter send_text all \x1b[13;2u
map alt+shift+enter send_text all \x1b[13;4u
